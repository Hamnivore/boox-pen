<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pen pad</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; color: #000; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none; font: 22px/1.3 sans-serif; }
  /* Palm zone = everything outside #area, shaded via a huge box-shadow. */
  #area { position: fixed; display: none; border: 3px solid #000; box-sizing: border-box;
    box-shadow: 0 0 0 9999px #d8d8d8; }
  #msg { position: fixed; top: 42%; left: 0; right: 0; text-align: center; color: #222; padding: 0 24px; font-size: 28px; }
  /* Screen selector: lives in the palm strip, rotated to read upright for the user. */
  #bar { position: fixed; display: flex; align-items: center; justify-content: center; gap: 14px;
    transform-origin: center; }
  #bar button { font: inherit; background: #fff; color: #000; border: 2px solid #000; border-radius: 10px;
    padding: 10px 18px; min-width: 120px; }
  #bar button.on { background: #000; color: #fff; }
  #bar .hint { color: #444; }
</style></head>
<body>
<div id="area"></div>
<div id="msg"></div>
<div id="bar"></div>
<script>
  // In landscape-primary the BOOX Tab Ultra C's digitizer lines up 1:1 with the page
  // (measured 2026-11-19: scale 1.000, offset 0.000), so raw sensor fractions are page fractions.
  const ORIENTATION = "landscape-primary";

  // ---- Swallow everything so Android does nothing with the pen while it drives the laptop. ----
  // Listeners below all sit on window (capture) too, and use ev.target, since propagation stops here.
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  for (const t of ["pointerdown","pointermove","pointerup","pointercancel","touchstart","touchmove","touchend",
                   "mousedown","mousemove","mouseup","click","dblclick","contextmenu",
                   "wheel","gesturestart","selectstart","dragstart","keydown"])
    window.addEventListener(t, stop, { passive: false, capture: true });
  // First tap (the bridge injects one) goes fullscreen, which also allows locking the orientation.
  window.addEventListener("pointerup", () => {
    if (!document.fullscreenElement)
      document.documentElement.requestFullscreen({ navigationUI: "hide" })
        .then(() => screen.orientation && screen.orientation.lock(ORIENTATION)).catch(() => {});
  }, { capture: true });

  const $ = id => document.getElementById(id);
  const msg = $("msg"), box = $("area"), bar = $("bar");
  let S = null;
  const getState = () => fetch("/state.json", { cache: "no-store" }).then(r => r.json());
  getState().then(s => { S = s; draw(); }).catch(() => {});

  function draw() {
    if (!S) return;
    const type = screen.orientation ? screen.orientation.type : ORIENTATION;
    if (type !== ORIENTATION) {
      box.style.display = "none"; bar.innerHTML = "";
      msg.textContent = "Turn the tablet to landscape (it locks once fullscreen).";
      return;
    }
    msg.textContent = "";
    const W = innerWidth, H = innerHeight, [p0, q0, p1, q1] = S.area;
    const L = p0 * W, T = q0 * H, R = p1 * W, B = q1 * H;
    Object.assign(box.style, { display: "block", left: L + "px", top: T + "px", width: R - L + "px", height: B - T + "px" });
    // Palm strip = the biggest gap around the area.
    const strip = [{ x: 0, y: 0, w: L, h: H }, { x: R, y: 0, w: W - R, h: H },
                   { x: 0, y: 0, w: W, h: T }, { x: 0, y: B, w: W, h: H - B }]
      .sort((g1, g2) => g2.w * g2.h - g1.w * g1.h)[0];
    // The user's "right" = the output +s direction in sensor (= page) coords; snap to 90°
    // so the selector reads upright with --rotate too.
    const angle = Math.round(Math.atan2(S.ds[1] * H, S.ds[0] * W) / (Math.PI / 2)) * 90;
    const side = angle % 180 !== 0;
    Object.assign(bar.style, { left: strip.x + strip.w / 2 + "px", top: strip.y + strip.h / 2 + "px",
      width: (side ? strip.h : strip.w) + "px", height: (side ? strip.w : strip.h) + "px",
      transform: `translate(-50%, -50%) rotate(${angle}deg)` });
    renderBar();
  }

  // ---- Screen selector with hold-to-unlock (palm-proof). ----
  let unlocked = false, relockTimer = 0, holdTimer = 0, hold = null, pending = null;
  const active = new Map();   // pointerId -> {x, y}
  function renderBar(note) {
    if (!S || !S.can_switch) { bar.innerHTML = ""; return; }
    if (!unlocked) {
      bar.innerHTML = `<button data-hold>Screen: ${S.active || "?"}</button>` +
        `<span class="hint">${note || "hold 1 s to change"}</span>`;
    } else {
      bar.innerHTML = S.screens.map(s =>
        `<button data-screen="${s.name}" class="${s.name === S.active ? "on" : ""}">${s.name}<br><small>${s.w}×${s.h}</small></button>`
      ).join("") + `<span class="hint">tap one</span>`;
    }
  }
  function relock() { unlocked = false; clearTimeout(relockTimer); renderBar(); }
  function cancelHold() { clearTimeout(holdTimer); if (hold) { hold = null; renderBar(); } }

  window.addEventListener("pointerdown", ev => {
    active.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (active.size > 1) { cancelHold(); pending = null; return; }       // two contacts = palm/hand
    const big = (ev.width || 0) > 60 || (ev.height || 0) > 60;            // fat contact = palm
    const el = ev.target.closest && ev.target.closest("[data-hold],[data-screen]");
    if (!el || big) return;
    if (el.dataset.hold !== undefined && !unlocked) {
      hold = { id: ev.pointerId, x: ev.clientX, y: ev.clientY };
      renderBar("keep holding…");
      holdTimer = setTimeout(() => {
        hold = null; unlocked = true;
        getState().then(s => { S = s; renderBar(); }).catch(renderBar);
        relockTimer = setTimeout(relock, 5000);
      }, 1000);
    } else if (el.dataset.screen && unlocked) {
      pending = { id: ev.pointerId, name: el.dataset.screen, x: ev.clientX, y: ev.clientY, t: performance.now() };
    }
  }, { capture: true });
  window.addEventListener("pointermove", ev => {
    const far = o => o && o.id === ev.pointerId && Math.hypot(ev.clientX - o.x, ev.clientY - o.y) > 20;
    if (far(hold)) cancelHold();
    if (far(pending)) pending = null;
  }, { capture: true });
  const up = ev => {
    active.delete(ev.pointerId);
    if (hold && hold.id === ev.pointerId) cancelHold();
    if (pending && pending.id === ev.pointerId && performance.now() - pending.t < 600) {
      const name = pending.name; pending = null;
      fetch("/screen", { method: "POST", body: name }).then(r => r.json())
        .then(s => { S = s; relock(); draw(); }).catch(relock);
    }
    pending = null;
  };
  window.addEventListener("pointerup", up, { capture: true });
  window.addEventListener("pointercancel", up, { capture: true });

  addEventListener("resize", draw);
  if (screen.orientation) screen.orientation.addEventListener("change", draw);
</script>
</body></html>
